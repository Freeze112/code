<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechStore — electronics shop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header>
  <div class="logo">TechStore</div>
  <div class="search">
    <input type="text" placeholder="Search electronics..." />
    <button class="btn">Cart</button>
  </div>
</header>

<section class="hero">
  <h1>Future technology</h1>
  <p>Smartphones, laptops and gadgets at the best prices. Simple, fast and convenient.</p>
</section>

<section class="products">
  <div class="card">
    <div class="tag">Smartphones</div>
    <div class="name">iPhone 15 Pro</div>
    <div class="price">$999</div>
    <button class="btn">Add to cart</button>
  </div>

  <div class="card">
    <div class="tag">Laptops</div>
    <div class="name">MacBook Air M3</div>
    <div class="price">$1299</div>
    <button class="btn">Add to cart</button>
  </div>

  <div class="card">
    <div class="tag">Smartphones</div>
    <div class="name">Samsung S24 Ultra</div>
    <div class="price">$1199</div>
    <button class="btn">Add to cart</button>
  </div>

  <div class="card">
    <div class="tag">Headphones</div>
    <div class="name">Sony WH-1000XM5</div>
    <div class="price">$349</div>
    <button class="btn">Add to cart</button>
  </div>
</section>

<footer>
  © 2026 TechStore. All rights reserved.
</footer>

</body>
</html>
