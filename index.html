<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechStore</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <div class="logo">TechStore</div>
  <div class="search">
    <input type="text" placeholder="Search products..." />
    <button class="btn">Cart</button>
  </div>
</header>

<section class="hero">
  <h1>Experience technology in a new way</h1>
  <p>Premium smartphones, laptops and accessories designed for performance and simplicity.</p>
  <button class="btn hero-btn">Explore products</button>
</section>

<section class="products">

  <div class="card">
    <div class="tag">Smartphone</div>
    <div class="name">iPhone 15 Pro</div>
    <div class="price">$999</div>
    <button class="btn">Add to cart</button>
  </div>

  <div class="card">
    <div class="tag">Laptop</div>
    <div class="name">MacBook Air M3</div>
    <div class="price">$1299</div>
    <button class="btn">Add to cart</button>
  </div>

  <div class="card">
    <div class="tag">Smartphone</div>
    <div class="name">Samsung S24 Ultra</div>
    <div class="price">$1199</div>
    <button class="btn">Add to cart</button>
  </div>

  <div class="card">
    <div class="tag">Headphones</div>
    <div class="name">Sony WH-1000XM5</div>
    <div class="price">$349</div>
    <button class="btn">Add to cart</button>
  </div>

</section>

<footer>
  © 2026 TechStore. All rights reserved.
</footer>

</body>
</html>
